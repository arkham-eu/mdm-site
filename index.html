// SOUND ENGINE — Web Audio API synth sounds, no external files
// ═══════════════════════════════════════════════════════════════════════════

const SFX = (() => {
  let ctx = null;
  let enabled = true;
  let initialized = false;

  function init() {
    if (initialized) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      initialized = true;
    } catch (e) { enabled = false; }
  }

  function osc(freq, dur, type = "square", vol = 0.06, detune = 0) {
    if (!enabled || !ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    o.detune.value = detune;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.connect(g);
    g.connect(ctx.destination);
    o.start(ctx.currentTime);
    o.stop(ctx.currentTime + dur);
  }

  function noise(dur, vol = 0.03) {
    if (!enabled || !ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    const len = ctx.sampleRate * dur;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
    const src = ctx.createBufferSource();
    const g = ctx.createGain();
    src.buffer = buf;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    src.connect(g);
    g.connect(ctx.destination);
    src.start();
  }

  return {
    init,
    // Typewriter tick — tiny short noise click
    tick() { noise(0.015, 0.025); },
    // Boot beep — ascending tone
    bootBeep(i) { osc(200 + i * 60, 0.08, "square", 0.04); },
    // Navigate / select — short glitch sweep
    nav() {
      osc(800, 0.06, "sawtooth", 0.05);
      setTimeout(() => osc(1200, 0.04, "square", 0.04), 30);
      noise(0.05, 0.04);
    },
    // Keystroke — subtle click
    key() { noise(0.02, 0.02); },
    // Error / invalid command
    err() { osc(120, 0.15, "sawtooth", 0.05); },
    // Boot complete
    bootDone() {
      osc(600, 0.1, "square", 0.04);
      setTimeout(() => osc(900, 0.12, "square", 0.04), 80);
      setTimeout(() => osc(1200, 0.15, "square", 0.05), 160);
    },
    // Secret found
    secret() {
      [400, 500, 600, 800, 1000].forEach((f, i) =>
        setTimeout(() => osc(f, 0.1, "sine", 0.04), i * 60)
      );
    },
    // Game start
    gameStart() {
      osc(300, 0.08, "square", 0.04);
      setTimeout(() => osc(600, 0.1, "square", 0.05), 100);
    },
    // Link hover
    hover() { osc(1400, 0.03, "sine", 0.02); },
  };
})();

// TYPEWRITER HOOK — optimized with requestAnimationFrame
// ═══════════════════════════════════════════════════════════════════════════

function useTypewriter(lines, speed = 12, enabled = true) {
  const [displayed, setDisplayed] = useState([]);
  const [done, setDone] = useState(false);
  const cancelRef = useRef(false);
  const skipRef = useRef(false);
  const skip = useCallback(() => { skipRef.current = true; }, []);

  useEffect(() => {
    if (!enabled) { setDisplayed([]); setDone(false); return; }
    setDisplayed([]); setDone(false);
    cancelRef.current = false; skipRef.current = false;
    let animId, li = 0, ci = 0, last = 0, charCount = 0;
    const buf = [];
    function step(ts) {
      if (cancelRef.current) return;
      if (skipRef.current) { setDisplayed([...lines]); setDone(true); return; }
      if (!last) last = ts;
      if (ts - last >= speed) {
        last = ts;
        if (li < lines.length) {
          const cur = lines[li];
          if (!cur || cur.length === 0) { buf[li] = ""; li++; ci = 0; }
          else if (ci < cur.length) { buf[li] = cur.substring(0, ++ci); charCount++; if (charCount % 3 === 0) SFX.tick(); }
          else { li++; ci = 0; }
          setDisplayed([...buf]);
        } else { setDone(true); return; }
      }
      animId = requestAnimationFrame(step);
    }
    animId = requestAnimationFrame(step);
    return () => { cancelRef.current = true; if (animId) cancelAnimationFrame(animId); };
  }, [lines, speed, enabled]);
  return { displayed, done, skip };
}

// WASTELAND RUNNER — fully imperative canvas, no React re-renders
// ═══════════════════════════════════════════════════════════════════════════

const GW = 600, GH = 200, GGY = 160, GPW = 24, GPH = 32;

function WastelandRunner({ onExit }) {
  const canvasRef = useRef(null);
  const stRef = useRef(null);

  useEffect(() => {
    const c = canvasRef.current; if (!c) return;
    const ctx = c.getContext("2d");
    const OBS = [
      { w:16,h:18,art:["▄█▄"," █ "]},{ w:20,h:24,art:["┌──┐","│▓▓│","└──┘"]},
      { w:14,h:34,art:["  ▌ ","█▌█"," ▌█"," ▌ "," █ "]},{ w:22,h:20,art:[" ▄██▄","▀█▀▀█▀"," ▀▀▀ "]},
    ];
    const RF = [[" ○ ","╱│╲","╱ ╲"],[" ○ ","╱│╲","│ │"]];
    const JF = [" ○ ","╱│╲"," ^ "], DF = ["   "," ○─","╱═╲"], XF = [" ✕ ","/│\\","/ \\"];

    const s = {
      p:{x:60,y:GGY-GPH,vy:0,j:false,d:false}, obs:[], fr:0, sp:4, sc:0, hi:0,
      over:false, go:false, st:0, go2:0, pts:[]
    };
    stRef.current = s;

    function dt(t,x,y,sz=12,a=1){ctx.globalAlpha=a;ctx.font=`${sz}px 'Share Tech Mono',monospace`;ctx.fillText(t,x,y);ctx.globalAlpha=1;}

    let aid;
    function loop() {
      ctx.clearRect(0,0,GW,GH);ctx.fillStyle="#0a0a08";ctx.fillRect(0,0,GW,GH);ctx.fillStyle="#33FF00";
      s.go2=(s.go2+(s.go&&!s.over?s.sp:0))%8;
      for(let x=-s.go2;x<GW;x+=8)dt("═",x,GGY+10,10,0.3);
      for(let x=-s.go2*.5;x<GW;x+=30+Math.sin(x)*10)dt("·",x,GGY+20,8,0.1);
      for(let x=-(s.fr*.3%120);x<GW+60;x+=120)dt("⌂",x,30,40,0.07);

      if(s.go&&!s.over){
        s.fr++;s.sc=Math.floor(s.fr/6);s.sp=4+Math.floor(s.fr/300)*.5;
        s.st--;
        if(s.st<=0){const t=OBS[Math.floor(Math.random()*OBS.length)];s.obs.push({x:GW+20,t});s.st=70+Math.random()*80-Math.min(s.sp*3,30);}
        s.obs=s.obs.filter(o=>o.x>-50);s.obs.forEach(o=>{o.x-=s.sp;});
        const p=s.p;
        if(p.j){p.vy+=.65;p.y+=p.vy;if(p.y>=GGY-GPH){p.y=GGY-GPH;p.vy=0;p.j=false;}}
        const pH=p.d?GPH*.5:GPH,pY=p.d?p.y+GPH*.5:p.y;
        for(const o of s.obs){const oY=GGY-o.t.h;if(p.x+GPW>o.x+4&&p.x<o.x+o.t.w-4&&pY+pH>oY+4&&pY<oY+o.t.h){
          s.over=true;s.hi=Math.max(s.hi,s.sc);
          for(let i=0;i<12;i++)s.pts.push({x:p.x+GPW/2,y:p.y+GPH/2,vx:(Math.random()-.5)*6,vy:(Math.random()-.8)*5,l:30+Math.random()*20,c:["*","×","·","▪","░"][Math.floor(Math.random()*5)]});
        }}
        s.pts=s.pts.filter(p=>p.l>0);s.pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.l--;});
      }
      s.pts.forEach(p=>{dt(p.c,p.x,p.y,10,p.l/40);});
      ctx.fillStyle="#33FF00";
      s.obs.forEach(o=>{const oY=GGY-o.t.h;o.t.art.forEach((l,i)=>{dt(l,o.x,oY+i*10+10,10);});});
      const p=s.p;let f;
      if(s.over)f=XF;else if(p.j)f=JF;else if(p.d)f=DF;else f=RF[Math.floor(s.fr/8)%2];
      const dy=p.d?p.y+10:p.y;
      ctx.shadowColor="#33FF00";ctx.shadowBlur=8;
      f.forEach((l,i)=>{dt(l,p.x,dy+i*11+10,12);});ctx.shadowBlur=0;
      dt(`SCORE: ${String(s.sc).padStart(5,"0")}`,GW-140,20,12);
      if(s.hi>0)dt(`HI: ${String(s.hi).padStart(5,"0")}`,GW-140,36,10,0.5);
      dt(`RAD: ${Math.min(999,Math.floor(s.fr/10))}`,10,20,10,0.4);
      if(!s.go){
        dt("WASTELAND RUNNER",GW/2-80,60,16);dt("SPACE / TAP to jump",GW/2-75,85,11,0.6);
        dt("DOWN to duck · ESC to exit",GW/2-100,100,11,0.4);
        const idle=RF[Math.floor(Date.now()/400)%2];idle.forEach((l,i)=>{dt(l,p.x,p.y+i*11+10,12);});
      }
      if(s.over){
        const fl=Math.sin(Date.now()/100)>0?1:0.7;
        dt(">> SYSTEM FAILURE <<",GW/2-90,70,16,fl);dt("SPACE to reboot · ESC to exit",GW/2-115,95,11,0.5);
      }
      aid=requestAnimationFrame(loop);
    }
    aid=requestAnimationFrame(loop);
    return()=>{if(aid)cancelAnimationFrame(aid);};
  },[]);

  useEffect(()=>{
    function act(){
      const s=stRef.current;if(!s)return;
      if(s.over){s.p={x:60,y:GGY-GPH,vy:0,j:false,d:false};s.obs=[];s.fr=0;s.sp=4;s.sc=0;s.over=false;s.go=true;s.st=0;s.pts=[];return;}
      if(!s.go){s.go=true;return;}
      if(!s.p.j){s.p.vy=-11;s.p.j=true;}
    }
    function dk(d){const s=stRef.current;if(s&&s.go&&!s.over)s.p.d=d;}
    function kd(e){if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();act();}if(e.code==="ArrowDown"){e.preventDefault();dk(true);}if(e.code==="Escape")onExit();}
    function ku(e){if(e.code==="ArrowDown")dk(false);}
    window.addEventListener("keydown",kd);window.addEventListener("keyup",ku);
    const cv=document.getElementById("gr-canvas");
    if(cv){cv.addEventListener("click",act);cv.addEventListener("touchstart",(e)=>{e.preventDefault();act();},{passive:false});}
    return()=>{window.removeEventListener("keydown",kd);window.removeEventListener("keyup",ku);};
  },[onExit]);

  return(
    <div style={{position:"fixed",inset:0,zIndex:2000,background:"#0a0a08",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontFamily:"'Share Tech Mono',monospace"}}>
      <div style={{color:"#33FF00",fontSize:10,letterSpacing:2,opacity:0.35,marginBottom:12}}>MDM SYSTEMS — WASTELAND RUNNER v1.0</div>
      <div style={{border:"1px solid #33FF0022",borderRadius:2,boxShadow:"0 0 30px rgba(0,255,0,0.04)",overflow:"hidden"}}>
        <canvas id="gr-canvas" ref={canvasRef} width={GW} height={GH} style={{display:"block",maxWidth:"95vw",height:"auto",cursor:"pointer"}}/>
      </div>
      <div style={{color:"#33FF00",fontSize:9,letterSpacing:2,opacity:0.25,marginTop:12,textAlign:"center"}}>SPACE/TAP = JUMP · DOWN = DUCK · ESC = EXIT</div>
      <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:2002,background:"repeating-linear-gradient(0deg,rgba(0,0,0,0.08) 0px,rgba(0,0,0,0.08) 1px,transparent 1px,transparent 3px)"}}/>
      <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:2003,background:"radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.5) 100%)"}}/>
    </div>
  );
}

function Line({ text, data, clickable, onClick }) {
  if (!text && text !== "") return null;
  const link = data?.link;
  const cls = [
    "tl",
    clickable && "tl-opt",
    link && !clickable && "tl-link",
    data?.heading && "tl-heading",
    data?.dim && "tl-dim",
    data?.accent && "tl-accent",
  ].filter(Boolean).join(" ");

  if (link && !clickable) {
    return <a href={link} target="_blank" rel="noopener noreferrer" className={cls} onClick={e=>e.stopPropagation()} onMouseEnter={SFX.hover} aria-label={text.replace(/→\s*/,"")}>{text}</a>;
  }
  if (clickable) {
    return <button type="button" className={cls} onClick={e=>{e.stopPropagation();onClick?.();}} onMouseEnter={SFX.hover} aria-label={text.replace(/\[\d\]\s*/,"")}>{text}</button>;
  }
  return <div className={cls}>{text}</div>;
}

      { t: "" },
    ];
    return { lines: raw.map(r => r.t), lineData: raw };
  }, [section]);

  const bootTyper = useTypewriter(BOOT_LINES, 14, phase === "boot");
  const contentTyper = useTypewriter(lines, 10, phase === "menu");

  // Boot → menu transition
  useEffect(() => {
    if (phase === "boot" && bootTyper.done) {
      SFX.bootDone();
      const t = setTimeout(() => {
        setPhase("menu");
        try { sessionStorage.setItem("mdm-booted", "1"); } catch {}
      }, 400);
      return () => clearTimeout(t);
    }
  }, [phase, bootTyper.done]);

  // Focus input after navigation
  useEffect(() => {
    if (phase === "menu" && !game) setTimeout(() => inputRef.current?.focus(), 80);
  }, [phase, section, game]);

  // Scroll only on content change
  useEffect(() => {
    const d = phase === "boot" ? bootTyper.displayed : contentTyper.displayed;
    if (d.length !== prevLenRef.current) {
      prevLenRef.current = d.length;
      scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight });
    }
  }, [phase, bootTyper.displayed, contentTyper.displayed]);

  const nav = useCallback((target) => {
    SFX.nav();
    setGlitch(true);
    setTimeout(() => { setSection(target); setGlitch(false); setInput(""); prevLenRef.current = 0; }, 150);
  }, []);

  const handleKey = useCallback((e) => {
    if (e.key !== "Enter") return;
    const v = input.trim().toLowerCase();
    if (!v) return;
    setInput("");
    if (v === SECRET_CODE) { SFX.secret(); nav("secret"); return; }
    if (v === GAME_CODE) { SFX.gameStart(); setGame(true); return; }
    if (section === "main") {
      const all = [...SECTIONS.main.primary, ...SECTIONS.main.secondary];
      const opt = all.find(o => o.key === v);
      if (opt) { nav(opt.target); return; }
    } else {
      if (v === "0" || v === "back") { nav("main"); return; }
    }
    const t = matchCommand(v);
    if (t) nav(t);
    else SFX.err();
  }, [input, section, nav]);

  const handleSkip = useCallback(() => {
    SFX.init();
    if (phase === "boot") bootTyper.skip(); else contentTyper.skip();
  }, [phase, bootTyper, contentTyper]);

  // Resolve which option a line maps to (for click)
  const getOption = useCallback((text) => {
    if (section === "main") {
      const all = [...SECTIONS.main.primary, ...SECTIONS.main.secondary];
      return all.find(o => text?.includes(`[${o.key}]`));
    }
    return null;
  }, [section]);

  const displayed = phase === "boot" ? bootTyper.displayed : contentTyper.displayed;
  const isDone = phase === "boot" ? bootTyper.done : contentTyper.done;

  if (game) {
    return <><FontLoader/><WastelandRunner onExit={() => { setGame(false); setTimeout(() => inputRef.current?.focus(), 80); }}/></>;
  }

  return (
    <div onClick={handleSkip} className="crt-flicker term-root" role="main">
      <FontLoader/>
      <CRTOverlay/>
      {glitch && <div className="glitch-flash" aria-hidden="true"/>}

      <div ref={scrollRef} className="term-scroll">
        {/* Top bar */}
        <header className="term-header">
          <span>MDM SYSTEMS UNIFIED OS</span>
          <span>{SITE.established}</span>
        </header>

        {/* Content */}
        <div className="term-content" role="region" aria-label="Terminal content">
          {displayed.map((text, i) => {
            const data = phase === "menu" ? lineData[i] : { t: text };
            const isBack = section !== "main" && text?.includes("[0] BACK");
            const opt = getOption(text);
            const clickable = !!(opt || isBack);
            return (
              <Line key={`${section}-${i}`} text={text} data={data} clickable={clickable}
                onClick={() => { if (opt) nav(opt.target); if (isBack) nav("main"); }}
              />
            );
          })}
          {!isDone && <div className="tl"><Cursor/></div>}
        </div>

        {/* Input */}
        {phase === "menu" && isDone && (
          <div className="term-input-row">
            <span aria-hidden="true">&gt;&gt;</span>
            <label htmlFor="term-cmd" className="sr-only">Terminal command input</label>
            <input
              id="term-cmd" ref={inputRef} value={input}
              onChange={e => { SFX.init(); SFX.key(); setInput(e.target.value); }}
              onKeyDown={handleKey}
              onClick={e => e.stopPropagation()}
              placeholder="type a command..."
              autoComplete="off" autoCapitalize="off" spellCheck="false"
              className="term-input"
              aria-label="Terminal command"
            />
            <Cursor/>
          </div>
        )}
      </div>

      {/* Footer */}
      <footer className="term-footer">
        <div className="term-footer-inner">
          <span>{SITE.brand} OS {SITE.version}</span>
          <span className="term-footer-hint">TAP TO SKIP · TYPE TO NAVIGATE</span>
          <span>SECTOR: {SITE.sector}</span>
        </div>
      </footer>

      <style>{`
        /* ── Reset & Base ────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        .sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0; }

        .term-root {
          position:fixed;inset:0;
          background:#0a0a08;
          font-family:'Share Tech Mono','Courier New',monospace;
          color:#33FF00;overflow:hidden;cursor:default;
          -webkit-font-smoothing:antialiased;
        }

        /* ── CRT Effects ─────────────────────────────── */
        @keyframes crtFlicker {
          0%{opacity:1}3%{opacity:.94}4%{opacity:1}8%{opacity:.97}9%{opacity:1}
          45%{opacity:1}46%{opacity:.96}47%{opacity:1}
          88%{opacity:1}89%{opacity:.92}89.5%{opacity:1}100%{opacity:1}
        }
        @keyframes cursorBlink { 0%,49%{opacity:1}50%,100%{opacity:0} }
        @keyframes glitchIn {
          0%{opacity:1;transform:translateX(-2px)}
          25%{opacity:.8;transform:translateX(2px)}
          50%{opacity:1;transform:translateX(-1px)}
          100%{opacity:0;transform:none}
        }

        @keyframes scanDrift { 0%{top:-100%}100%{top:100%} }
        .crt-flicker { animation: crtFlicker 4s infinite; }
        .crt-scan {
          position:fixed;inset:0;pointer-events:none;z-index:1000;
          background:repeating-linear-gradient(0deg,rgba(0,0,0,0.22) 0px,rgba(0,0,0,0.22) 1px,transparent 1px,transparent 2.5px);
          mix-blend-mode:multiply;
        }
        .crt-scan::after {
          content:'';position:absolute;left:0;right:0;height:120px;
          background:linear-gradient(transparent,rgba(51,255,0,0.04),transparent);
          animation:scanDrift 6s linear infinite;pointer-events:none;
        }
        .crt-vignette {
          position:fixed;inset:0;pointer-events:none;z-index:1001;
          background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.75) 100%);
        }
        .crt-glow {
          position:fixed;inset:0;pointer-events:none;z-index:1002;
          box-shadow:inset 0 0 180px rgba(0,255,0,0.06),inset 0 0 60px rgba(0,0,0,0.4);
        }
        .glitch-flash {
          position:fixed;inset:0;z-index:999;
          background:rgba(51,255,0,0.1);
          animation:glitchIn .2s ease-out forwards;
        }
        .tc { color:#33FF00;font-weight:bold;animation:cursorBlink 1.06s step-end infinite;text-shadow:0 0 10px rgba(51,255,0,0.8); }

        /* ── Layout ───────────────────────────────────── */
        .term-scroll {
          position:relative;z-index:10;
          max-width:740px;margin:0 auto;
          padding:36px 32px 140px;
          height:100vh;height:100dvh;
          overflow-y:auto;scrollbar-width:none;
        }
        .term-scroll::-webkit-scrollbar { display:none; }

        .term-header {
          display:flex;justify-content:space-between;
          font-size:11px;letter-spacing:2px;opacity:.5;
          border-bottom:1px solid #33FF0055;
          padding-bottom:12px;margin-bottom:24px;
          text-shadow:0 0 12px rgba(51,255,0,0.6);
        }

        .term-content { min-height:55vh; }

        /* ── Lines ────────────────────────────────────── */
        .tl {
          display:block;width:100%;
          font-size:15px;line-height:1.65;
          white-space:pre-wrap;word-break:break-word;
          letter-spacing:.8px;padding:1px 4px;
          text-shadow:0 0 10px rgba(51,255,0,0.6),0 0 3px rgba(51,255,0,0.4),0 0 30px rgba(51,255,0,0.1);
          background:none;border:none;color:#33FF00;
          text-align:left;text-decoration:none;
          font-family:inherit;cursor:default;
          border-radius:2px;transition:background .15s;
        }
        .tl-heading {
          color:#44FF22;font-size:16px;
          text-shadow:0 0 16px rgba(51,255,0,0.8),0 0 4px rgba(51,255,0,0.5),0 0 40px rgba(51,255,0,0.15);
        }
        .tl-dim { opacity:.5; }
        .tl-accent {
          color:#55FF33;
          text-shadow:0 0 14px rgba(85,255,51,0.65),0 0 4px rgba(51,255,0,0.4),0 0 35px rgba(51,255,0,0.12);
        }

        .tl-opt, .tl-link { cursor:pointer;padding:2px 4px; }
        .tl-opt:hover, .tl-opt:focus-visible,
        .tl-link:hover, .tl-link:focus-visible {
          background:rgba(51,255,0,0.16);color:#77FF44;outline:none;
          text-shadow:0 0 16px rgba(51,255,0,0.8),0 0 40px rgba(51,255,0,0.2);
        }
        .tl-link:hover, .tl-link:focus-visible {
          text-decoration:underline;
        }
        .tl-opt:focus-visible, .tl-link:focus-visible {
          box-shadow:0 0 0 1px #33FF0066;
        }

        /* ── Input ────────────────────────────────────── */
        .term-input-row {
          display:flex;align-items:center;gap:8px;
          margin-top:8px;padding:0 4px;
          font-size:15px;letter-spacing:.8px;
          text-shadow:0 0 10px rgba(51,255,0,0.6),0 0 30px rgba(51,255,0,0.1);
        }
        .term-input {
          background:none;border:none;outline:none;
          color:#33FF00;font-family:inherit;font-size:15px;
          letter-spacing:.8px;caret-color:#33FF00;
          flex:1;max-width:240px;
          text-shadow:0 0 10px rgba(51,255,0,0.6),0 0 30px rgba(51,255,0,0.1);
        }
        .term-input::placeholder { color:#33FF0030; }

        /* ── Footer ───────────────────────────────────── */
        .term-footer {
          position:fixed;bottom:0;left:0;right:0;z-index:10;
          background:linear-gradient(transparent,#0a0a08 30%);
          padding:30px 32px 16px;pointer-events:none;
        }
        .term-footer-inner {
          max-width:740px;margin:0 auto;
          display:flex;justify-content:space-between;
          font-size:10px;letter-spacing:2px;opacity:.35;
          border-top:1px solid #33FF0033;padding-top:8px;
        }

        /* ── Selection ────────────────────────────────── */
        ::selection { background:#33FF00;color:#0a0a08; }

        /* ── Mobile ───────────────────────────────────── */
        @media(max-width:600px) {
          .term-scroll { padding:24px 18px 130px; }
          .tl { font-size:14px;letter-spacing:.6px;padding:1px 4px; }
          .tl-heading { font-size:15px; }
          .term-input-row { font-size:14px; }
          .term-input { font-size:14px;max-width:180px; }
          .term-footer-hint { display:none; }
          .term-footer-inner { font-size:8px; }
        }
      `}</style>
    </div>
  );
}

function FontLoader() {
  return <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Terminal />);
</script>
</body>
</html>
