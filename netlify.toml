[build]
  publish = "."

# ── Domain Redirects ──────────────────────────────────
# Redirect .world and .online to primary domain
[[redirects]]
  from = "https://manuelmendes.world/*"
  to = "https://manuelmendes.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.manuelmendes.world/*"
  to = "https://manuelmendes.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://manuelmendes.online/*"
  to = "https://manuelmendes.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.manuelmendes.online/*"
  to = "https://manuelmendes.io/:splat"
  status = 301
  force = true

# ── Security Headers ──────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── Cache: HTML pages ─────────────────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Cache: Static assets ─────────────────────────────
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
